name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    # Match Qt's MSVC 2022 binaries and the VS 17 generator below.
    # windows-latest uses VS 2026; windows-2022 retains VS 2022.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.10.2"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        # This MSVC job has no matching SuiteUi SDK; exercise the explicit fallback.
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DREGMAP_BUILD_APP=ON
          -DREGMAP_BUILD_TESTS=ON
          -DREGMAP_ENABLE_SUITEUI=OFF

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
